# Root Netlify config. The Enigma docs site is fully static, so we build a
# static export (output: 'export' via STATIC_EXPORT) and publish the `out/`
# directory as plain files — no Next.js serverless runtime and no Netlify Blobs
# (which avoids the flaky blob-upload step entirely).
#
# `base` is pinned to apps/enigma so Netlify's monorepo base resolution is
# deterministic; the build command runs there while pnpm installs the workspace
# from the repo root. `publish` is resolved relative to the repo root.

[build]
  base = "apps/enigma"
  command = "pnpm build"
  publish = "apps/enigma/out"

[build.environment]
  NODE_VERSION = "22"
  # Serve the docs at the site root (the app defaults to /enigma locally).
  NEXT_PUBLIC_BASE_PATH = ""
  # Emit a static export (out/) instead of a server build.
  STATIC_EXPORT = "true"
