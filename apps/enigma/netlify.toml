# Netlify config for the Enigma docs app. Deployed as a monorepo package
# (base = apps/enigma); pnpm installs the workspace from the repo root.
# The Next.js runtime is provided by @netlify/plugin-nextjs.

[build]
  command = "pnpm build:enigma"
  publish = "apps/enigma/.next"

[build.environment]
  NODE_VERSION = "22"
  # Serve the docs at the site root (the app defaults to /design-system locally).
  NEXT_PUBLIC_BASE_PATH = ""

[[plugins]]
  package = "@netlify/plugin-nextjs"
